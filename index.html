<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>campusconfess</title>
<style>
body{background:#0F0F1A;color:#fff;font-family:Arial;margin:0;padding:14px}
.card{background:#1A1A2E;padding:16px;border-radius:14px;text-align:center}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}
.btn{width:100%;padding:12px;border:none;border-radius:999px;font-weight:900;cursor:pointer;background:#A855F7;color:#fff;margin-top:6px}
.hidden{display:none!important}
</style></head><body>

<div id="authBox" class="card">
<h2>campusconfess</h2>
<p style="color:#aaa">Create Account - Zimbabwe 🇿🇼</p>
<input id="regName" placeholder="Your Name e.g. Shy Sparrow">
<input id="regSchool" placeholder="School e.g. Mutare Poly">
<select id="regGender">
<option value="">Select Gender * REQUIRED</option>
<option value="♀️ Female">♀️ Female</option>
<option value="♂️ Male">♂️ Male</option>
</select>
<button class="btn" onclick="createAccount()">Create My Account ✅</button>
</div>

<div id="profileBox" class="card hidden">
<p style="font-size:50px;margin:0">👤</p>
<h2 id="pName">-</h2>
<p><span style="color:#22C55E">🟢 Online now</span></p>
<p id="pLastSeen" style="color:#aaa;font-size:13px">Last seen: Just now</p>
<p id="pGender"></p>
<p id="pSchool"></p>
<button class="btn" style="background:#333" onclick="logout()">Log Out</button>
</div>

<script>
let me=JSON.parse(localStorage.getItem('cc_user')||'null');
function createAccount(){
let n=document.getElementById('regName').value.trim();
let s=document.getElementById('regSchool').value.trim();
let g=document.getElementById('regGender').value;
if(!n||!s||!g){alert('Fill Name + School + Gender! Gender is required!');return}
me={name:n,school:s,gender:g,lastSeen:"Just now"};
localStorage.setItem('cc_user',JSON.stringify(me));
showProfile();
}
function showProfile(){
document.getElementById('authBox').classList.add('hidden');
document.getElementById('profileBox').classList.remove('hidden');
document.getElementById('pName').innerText=me.name;
document.getElementById('pGender').innerText='Gender: '+me.gender;
document.getElementById('pSchool').innerText='🏫 '+me.school;
document.getElementById('pLastSeen').innerText='Last seen: '+me.lastSeen+' • 🟢 Online';
}
function logout(){localStorage.removeItem('cc_user');location.reload()}
if(me) showProfile();
</script></body></html>
